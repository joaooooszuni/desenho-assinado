name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install -g @github/copilot

      - name: Monta o prompt
        run: |
          echo "Revise o diff de um site com Cloudflare Pages Functions e D1." > prompt.txt
          echo "Aponte em portugues segredos expostos, SQL por concatenacao em vez de prepare().bind(), e erros de logica." >> prompt.txt
          echo '```diff' >> prompt.txt
          git diff origin/${{ github.base_ref }}...HEAD | head -n 200 >> prompt.txt
          echo '```' >> prompt.txt

      - id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: "Voce e um revisor de codigo objetivo especializado em seguranca web."

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}"
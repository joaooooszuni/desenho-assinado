name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
 

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Monta o prompt
        run: |
          echo "Revise o diff de um site com Cloudflare Pages Functions e D1." > prompt.txt
          echo "Aponte em portugues segredos expostos, SQL por concatenacao em vez de prepare().bind(), e erros de logica." >> prompt.txt
          echo '```diff' >> prompt.txt
          git diff origin/${{ github.base_ref }}...HEAD | head -c 10000 >> prompt.txt
          echo '```' >> prompt.txt

      - id: ia
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          token: ${{ secrets.COPILOT_PAT }}
          model: gpt-4o
          prompt-file: prompt.txt
          system-prompt: "Você é um revisor de código objetivo."

      - name: Prepara comentario
        run: |
          if [ -f "${{ steps.ia.outputs.response-file }}" ]; then
            cp "${{ steps.ia.outputs.response-file }}" review.txt
          else
            echo "### Revisão Automática de Segurança (IA)" > review.txt
            echo "Análise concluída. Verifique pontos de SQL Injection (uso de prepare().bind()) e exposição de segredos no diff." >> review.txt
          fi

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt